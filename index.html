<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Techwave</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-[#1A0B2E]">
    <header class="">
      <nav class="items-center my-4 w-max-7xl mx-auto px-20">
        <div class="flex justify-between">
          <h1 class="font-bold text-white text-4xl">
            Tech<span
              class="bg-gradient-to-tl from-yellow-300 via-pink-600 to-purple-700 hover:scale-105 transition duration-300 bg-clip-text text-transparent"
              >Wave</span
            >
          </h1>
          <div class="flex justify-between gap-3 text-white items-center">
            <p>About</p>
            <p>Episodes</p>
            <p>Host</p>
          </div>
          <button
            class="px-3 py-1 rounded-full text-white text-2xl font-semibold bg-gradient-to-tr from-yellow-300 via-pink-600 to-purple-700 hover:scale-105 transition duration-300"
          >
            Subscribe →
          </button>
        </div>
      </nav>
      <hr class="border border-white/8 mt-3" />

      <!-- banner section -->
      <div
        class="bg-[url('/assets/hero-bg.png')] bg-cover bg-center bg-no-repeat h-screen"
      >
        <!-- image  -->
        <div class="relative flex justify-center items-center">
          <img class="mx-auto pt-20" src="/assets/hero-circle.png" alt="" />

          <img class="absolute pt-20" src="/assets/microphone.png" alt="" />
        </div>

        <!-- text  -->
        <div class="mx-auto w-fit pt-6">
          <div class="text-center">
            <h1 class="text-white font-bold">TechWave</h1>
            <p class="text-sm text-white">
              Your daily dose of tech insights, productivity hacks, and personal
              growth
            </p>
          </div>

          <!-- button  -->
          <div class="flex justify-center gap-4 pt-3">
            <button
              class="px-3 py-2 rounded-full text-white text-2xl font-semibold bg-gradient-to-tr from-yellow-300 via-pink-600 to-purple-700 hover:scale-105 transition duration-300 flex justify-between gap-2 items-center text-[12px]"
            >
              <img class="h-7" src="/assets/spotify.png" alt="" />
              Listen On Spotify
            </button>
            <button
              class="px-3 py-1 rounded-full text-green-500 text-2xl flex justify-between gap-2 items-center border-2 text-[12px]"
            >
              <img class="" src="/assets/message.png" alt="" />
              Listen On Spotify
            </button>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
